name: Daily Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  signal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run daily signal script
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: dart run bin/daily_signal_runner.dart

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-signal-report
          path: build/reports/daily_signal_report.json
